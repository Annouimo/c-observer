name: GUI replay preview (no publishing)
on:
  push:
    branches: [refactor/printf-first]
    paths:
      - 'gui/**'
      - 'testdata/snapshots/**'
      - '.github/workflows/gui-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gui-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    name: Test and prepare shared inputs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Install, test and build frontend once
        working-directory: gui/frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
          npm test
          npm run build
      - name: Resolve Go dependencies once
        working-directory: gui
        run: go mod tidy
      - uses: actions/upload-artifact@v4
        with:
          name: gui-build-inputs
          path: |
            gui/frontend/dist
            gui/frontend/package-lock.json
            gui/go.mod
            gui/go.sum
          if-no-files-found: error
          retention-days: 7
  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            goos: windows
            arch: amd64
          - os: macos-15
            goos: darwin
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: gui
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: gui-build-inputs
          path: gui
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: gui/go.sum
      - name: Build Windows GUI
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CGO_ENABLED: '0'
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          go build -mod=readonly -tags production -trimpath -ldflags "-s -w -H windowsgui" -o out/c-observer-preview.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item out/c-observer-preview.exe | Select-Object Name,Length
          Compress-Archive -Path out/c-observer-preview.exe -DestinationPath out/gui-windows-amd64.zip
          Get-Item out/gui-windows-amd64.zip | Select-Object Name,Length
      - name: Build Apple Silicon app
        if: runner.os == 'macOS'
        shell: bash
        env:
          CGO_ENABLED: '1'
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          app="out/C Observer Preview.app"
          mkdir -p "$app/Contents/MacOS"
          go build -mod=readonly -tags production -trimpath -ldflags "-s -w" -o "$app/Contents/MacOS/c-observer-preview" .
          cp Info.plist "$app/Contents/Info.plist"
          codesign --force --sign - "$app"
          codesign --verify --strict "$app"
          file "$app/Contents/MacOS/c-observer-preview"
          du -sh "$app"
          ditto -c -k --keepParent "$app" out/gui-macos-arm64.zip
          ls -lh out/gui-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.goos }}-${{ matrix.arch }}
          path: gui/out/*.zip
          if-no-files-found: error
          retention-days: 7
