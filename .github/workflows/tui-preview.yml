name: TUI preview checks
on:
  push:
    branches: [feat/tui]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - run: go mod tidy
      - run: gofmt -w internal/tui cmd/c-observer-preview
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/c-observer-preview
      - run: cat go.sum
