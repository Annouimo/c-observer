name: TUI preview checks
on:
  push:
    branches: [feat/tui]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - run: test -z "$(gofmt -l internal/tui cmd/c-observer-preview)"
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/c-observer-preview
      - run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o c-observer-preview-macos-arm64 ./cmd/c-observer-preview
      - name: Render actual synthetic workspace previews
        run: |
          mkdir -p preview-text
          ./c-observer-preview -fixture testdata/snapshots/adaptive-array.json -dump -step 6 -width 100 -height 26 > preview-text/adaptive.txt
          ./c-observer-preview -fixture testdata/snapshots/adaptive-array.json -dump -step 0 -width 100 -height 26 > preview-text/result.txt
          ./c-observer-preview -fixture testdata/snapshots/adaptive-array.json -dump -step 6 -width 50 -height 18 > preview-text/narrow.txt
          cat preview-text/adaptive.txt preview-text/result.txt
      - run: cat go.sum
      - uses: actions/upload-artifact@v4
        with:
          name: tui-preview-linux
          path: |
            c-observer-preview
            testdata/snapshots/
            go.sum
            preview-text/
      - uses: actions/upload-artifact@v4
        with:
          name: tui-preview-macos-arm64
          path: |
            c-observer-preview-macos-arm64
            testdata/snapshots/
  real-lldb:
    name: Real LLDB frontend integration (Linux)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Install Clang and LLDB
        run: |
          sudo apt-get update
          if apt-cache show clang-19 lldb-19 >/dev/null 2>&1; then
            sudo apt-get install -y clang-19 lldb-19
          else
            sudo apt-get install -y clang lldb
          fi
          compiler="$(command -v clang-19 || command -v clang)"
          debugger="$(command -v lldb-dap-19 || command -v lldb-dap || find /usr/lib/llvm-*/bin -name lldb-dap -print | sort -V | tail -1)"
          test -x "$compiler" && test -x "$debugger"
          echo "C_OBSERVER_TEST_CLANG=$compiler" >> "$GITHUB_ENV"
          echo "C_OBSERVER_TEST_LLDB=$debugger" >> "$GITHUB_ENV"
          echo "$(dirname "$debugger")" >> "$GITHUB_PATH"
      - run: go mod tidy
      - run: C_OBSERVER_REAL_DEBUGGER=1 go test -v -run '^TestRealEngineReplay
 ./internal/tui
      - run: C_OBSERVER_REAL_DEBUGGER=1 go test -v ./internal/engine
      - name: Build actual Observer CLI
        run: go build -o "$RUNNER_TEMP/c-observer" ./cmd/c-observer
      - name: Check out reviewed Companion integration
        uses: actions/checkout@v4
        with:
          repository: Annouimo/accoding-companion
          ref: 01dc8011a52ef3b2e5e856ca97324f7026332a81
          path: companion-integration
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate a real assembled session from Companion
        working-directory: companion-integration
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          ACCODING_OBSERVER_PATH="$RUNNER_TEMP/c-observer" ACCODING_CC="$C_OBSERVER_TEST_CLANG" node --import tsx tests/standalone/observer-session-fixture.ts "$RUNNER_TEMP/course-integration" "$RUNNER_TEMP/session-path"
      - name: Replay the Companion session with LLDB
        run: |
          session="$(cat "$RUNNER_TEMP/session-path")"
          trap 'case "$(basename "$(dirname "$session")")" in accoding-observer-*) rm -rf -- "$(dirname "$session")";; esac' EXIT
          C_OBSERVER_COMPANION_SESSION="$session" go test -count=1 -v -run '^TestCompanionSessionReplay$' ./internal/tui
