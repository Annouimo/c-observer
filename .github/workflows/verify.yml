name: Verify Observer (no publishing)

on:
  pull_request:
    branches: [main, feat/tui]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Test models, fixtures and engine unit tests
        run: go test -v ./...
      - name: Static checks
        run: go vet ./...
