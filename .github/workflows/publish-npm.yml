name: Build and publish Observer GUI
on:
  push:
    branches: [main]
    paths: ['VERSION', 'PREVIEW_VERSION']
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: DRY_RUN
        required: true
        options: [DRY_RUN, PUBLISH_NEXT, PUBLISH_LATEST]
      version:
        description: Explicit beta version for PUBLISH_NEXT; stable must match VERSION
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: observer-gui-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      version: ${{ steps.select.outputs.version }}
      publish: ${{ steps.registry.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --test .github/scripts/npm-release-state.test.mjs
      - id: select
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_VERSION: ${{ inputs.version }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          mode=DRY_RUN
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then mode="${REQUESTED_MODE:-DRY_RUN}"; fi
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            test "$GITHUB_REF" = refs/heads/main
            git cat-file -e "$BEFORE^{commit}"
            if ! git diff --quiet "$BEFORE" "$GITHUB_SHA" -- VERSION; then
              mode=PUBLISH_LATEST
              REQUESTED_VERSION="$(cat VERSION)"
            elif ! git diff --quiet "$BEFORE" "$GITHUB_SHA" -- PREVIEW_VERSION; then
              mode=PUBLISH_NEXT
              REQUESTED_VERSION="$(cat PREVIEW_VERSION)"
            else
              exit 1
            fi
          fi
          if [[ "$mode" == PUBLISH_LATEST ]]; then version="${REQUESTED_VERSION:-$(cat VERSION)}"; else version="${REQUESTED_VERSION:-$(cat PREVIEW_VERSION)}"; fi
          stable='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          preview='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-(alpha|beta|rc|dev)\.(0|[1-9][0-9]*)$'
          case "$mode" in
            DRY_RUN) [[ "$version" =~ $stable || "$version" =~ $preview ]] ;;
            PUBLISH_NEXT) [[ "$version" =~ $preview && -n "$REQUESTED_VERSION" && "$version" == "$(cat PREVIEW_VERSION)" ]] ;;
            PUBLISH_LATEST) [[ "$version" =~ $stable && "$version" == "$(cat VERSION)" && "$version" != 0.1.2 ]] ;;
            *) exit 1 ;;
          esac
          if [[ "$mode" != DRY_RUN ]]; then test "$GITHUB_REF" = refs/heads/main; fi
          printf 'mode=%s\nversion=%s\n' "$mode" "$version" >> "$GITHUB_OUTPUT"
      - id: registry
        env:
          MODE: ${{ steps.select.outputs.mode }}
          VERSION: ${{ steps.select.outputs.version }}
        run: |
          set -euo pipefail
          case "$MODE" in
            DRY_RUN) echo publish=false >> "$GITHUB_OUTPUT" ;;
            PUBLISH_NEXT) node .github/scripts/npm-release-state.mjs @routilet/c-observer "$VERSION" next ;;
            PUBLISH_LATEST) node .github/scripts/npm-release-state.mjs @routilet/c-observer "$VERSION" latest ;;
          esac
  prepare:
    needs: plan
    if: needs.plan.outputs.mode == 'DRY_RUN' || needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      MODE: ${{ needs.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install and build shared frontend
        working-directory: gui/frontend
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Resolve Go dependencies and check shared code
        run: |
          set -euo pipefail
          go mod tidy
          git ls-files --error-unmatch gui/frontend/package-lock.json
          git diff --exit-code -- go.mod go.sum gui/frontend/package-lock.json
          go test ./internal/... ./cmd/...
          go vet ./internal/... ./cmd/...
      - name: Collect frontend notices
        run: |
          mkdir -p inputs/frontend
          node scripts/frontend-notices.mjs inputs/frontend/NOTICES.txt
      - uses: actions/upload-artifact@v4
        with:
          name: observer-gui-inputs
          path: |
            gui/frontend/dist
            gui/frontend/package-lock.json
            go.mod
            go.sum
            inputs/frontend/NOTICES.txt
          if-no-files-found: error
          retention-days: 7
  native:
    needs: [plan, prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
            goos: darwin
            arch: arm64
            cgo: '1'
          - runner: windows-2025
            target: win32-x64
            goos: windows
            arch: amd64
            cgo: '0'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.arch }}
      CGO_ENABLED: ${{ matrix.cgo }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: observer-gui-inputs
          path: .
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install Windows test toolchain (CI only)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-gdb
      - name: Verify actual macOS observation
        if: runner.os == 'macOS'
        env:
          C_OBSERVER_REAL_APP: '1'
          C_OBSERVER_REAL_DEBUGGER: '1'
        run: |
          set -euo pipefail
          xcrun clang --version
          xcrun --find lldb-dap
          # Retry only the known transient LLDB timeout of the large-array
          # fixture. All other failures and a failed retry still block release.
          set +e
          go test -mod=readonly -count=1 -v -json ./internal/app ./internal/engine | tee "$RUNNER_TEMP/native-mac-tests.jsonl"
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" != 0 ]]; then
            node --input-type=module - "$RUNNER_TEMP/native-mac-tests.jsonl" <<'NODE'
          import fs from 'node:fs';
          const lines=fs.readFileSync(process.argv[2],'utf8').trim().split('\n').map(JSON.parse);
          const failed=lines.filter(e=>e.Action==='fail'&&e.Test);
          const pkgFailures=lines.filter(e=>e.Action==='fail'&&!e.Test);
          const timedOut=lines.some(e=>e.Test==='TestRealObservation'&&e.Output?.includes('request_timed_out: variables: context deadline exceeded'));
          if(failed.length!==1||failed[0].Test!=='TestRealObservation'||pkgFailures.length!==1||!pkgFailures[0].Package?.endsWith('/internal/engine')||!timedOut)process.exit(1);
          NODE
            go test -mod=readonly -count=1 -v -run '^TestRealObservation$' ./internal/engine
          fi
      - name: Verify actual Windows observation
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          C_OBSERVER_REAL_APP: '1'
          C_OBSERVER_REAL_GDB: '1'
        run: |
          set -euo pipefail
          gcc --version
          gdb --version
          gdb -nx -batch -ex 'python import sys; print(sys.version)'
          go test -mod=readonly -count=1 -v ./internal/app ./internal/engine
      - name: Build and sign Apple Silicon app
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          go test -mod=readonly -tags production ./gui
          go vet -mod=readonly -tags production ./gui
          mkdir -p native 'stage/C Observer.app/Contents/MacOS'
          app='stage/C Observer.app'
          go build -mod=readonly -tags production -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "$app/Contents/MacOS/c-observer" ./gui
          cp gui/Info.plist "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION%%-*}" "$app/Contents/Info.plist"
          codesign --force --sign - "$app"
          codesign --verify --strict "$app"
          test "$("$app/Contents/MacOS/c-observer" --version)" = "$VERSION"
          "$app/Contents/MacOS/c-observer" --capabilities
          node scripts/native-gui-notices.mjs native/NOTICES.txt
          ditto -c -k --keepParent "$app" native/native.zip
      - name: Build native Windows GUI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test -mod=readonly -tags production ./gui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet -mod=readonly -tags production ./gui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force native,stage | Out-Null
          go build -mod=readonly -tags production -trimpath -ldflags "-s -w -H windowsgui -X main.version=$env:VERSION" -o stage/c-observer.exe ./gui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/native-gui-notices.mjs native/NOTICES.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path stage/c-observer.exe -DestinationPath native/native.zip
      - uses: actions/upload-artifact@v4
        with:
          name: observer-native-${{ matrix.target }}
          path: native/
          if-no-files-found: error
          retention-days: 7
  pack:
    needs: [plan, native]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      MODE: ${{ needs.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: observer-gui-inputs
          path: shared
      - uses: actions/download-artifact@v4
        with:
          name: observer-native-darwin-arm64
          path: inputs/darwin-arm64
      - uses: actions/download-artifact@v4
        with:
          name: observer-native-win32-x64
          path: inputs/win32-x64
      - run: |
          set -euo pipefail
          cp -R shared/inputs/frontend inputs/frontend
          node scripts/package-preview.mjs "$VERSION" inputs release "$MODE"
          (cd release; sha256sum *.tgz *.zip > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: observer-release-${{ env.VERSION }}
          path: |
            release/*.tgz
            release/*.zip
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
  native-install:
    needs: [plan, pack]
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, windows-2025]
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      MODE: ${{ needs.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: observer-release-${{ env.VERSION }}
          path: release
      - name: Install exact packaged tarball and verify CLI/manifest
        shell: bash
        run: |
          set -euo pipefail
          files=("$PWD"/release/*.tgz)
          test "${#files[@]}" = 1
          npm install --prefix "$RUNNER_TEMP/native-install" --no-save --ignore-scripts --no-audit --no-fund "${files[0]}"
          node scripts/check-installed-gui.mjs "$RUNNER_TEMP/native-install/node_modules/@routilet/c-observer" "$VERSION" "$MODE"
  publish:
    needs: [plan, pack, native-install]
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MODE: ${{ needs.plan.outputs.mode }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global 'npm@^11.21.0'
      - uses: actions/download-artifact@v4
        with:
          name: observer-release-${{ env.VERSION }}
          path: release
      - id: registry
        run: |
          set -euo pipefail
          tag=latest; if [[ "$MODE" == PUBLISH_NEXT ]]; then tag=next; fi
          node .github/scripts/npm-release-state.mjs @routilet/c-observer "$VERSION" "$tag"
      - name: Publish verified local npm tarball
        if: steps.registry.outputs.publish == 'true'
        run: |
          set -euo pipefail
          (cd release; sha256sum -c SHA256SUMS)
          tag=latest; if [[ "$MODE" == PUBLISH_NEXT ]]; then tag=next; fi
          shopt -s nullglob
          packages=(./release/*.tgz)
          test "${#packages[@]}" = 1
          npm publish "${packages[0]}" --access public --tag "$tag"
          echo "Published @routilet/c-observer@$VERSION to $tag" >> "$GITHUB_STEP_SUMMARY"
  github-release:
    # Separate optional channel: a GitHub permission error must not undo or
    # obscure a successful npm publication. Do not grant a PAT to this job.
    needs: [plan, pack, native-install, publish]
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    env:
      MODE: ${{ needs.plan.outputs.mode }}
      VERSION: ${{ needs.plan.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: observer-release-${{ env.VERSION }}
          path: release
      - name: Create release from the current verified source
        run: |
          set -euo pipefail
          (cd release; sha256sum -c SHA256SUMS)
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then echo "Release exists; no overwrite"; exit 0; fi
          # Tag the exact source commit, not a branch tip that may have moved.
          # If GitHub refuses tag or Release creation, the verified artifact
          # remains available for the maintainer to create a Release manually.
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            if ! gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA"; then
              echo "::warning::GitHub refused tag creation; npm already published. Create the version tag and Release manually from the verified artifact."
              echo "GitHub tag creation failed. Use artifact observer-release-$VERSION from this run." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi
          actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)"
          test "$actual" = "$GITHUB_SHA"
          args=()
          notes=docs/release-notes.md
          if [[ "$MODE" == PUBLISH_NEXT ]]; then args+=(--prerelease --latest=false); notes=docs/release-notes-beta.md; fi
          if ! gh release create "$tag" release/*.zip release/*.tgz release/SHA256SUMS --verify-tag --title "C Observer $VERSION" --notes-file "$notes" "${args[@]}"; then
            echo "::warning::GitHub Release creation failed; npm publication is independent. Use the verified release artifact."
            echo "GitHub Release creation failed; create it manually using observer-release-$VERSION from this run." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
