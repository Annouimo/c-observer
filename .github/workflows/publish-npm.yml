name: Prepare and publish Observer npm
on:
  push:
    branches: [main]
    paths: ['VERSION', '.github/workflows/publish-npm.yml', '.github/scripts/npm-release-state*.mjs']
  pull_request:
    branches: [main, feat/tui]
    paths:
      - 'VERSION'
      - '.github/scripts/npm-release-state*.mjs'
      - '.github/workflows/publish-npm.yml'
      - 'scripts/**'
      - 'LICENSE'
      - 'docs/npm-readme.md'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/c-observer/**'
      - 'internal/**'
  workflow_dispatch:
    inputs:
      mode:
        description: "AUTO: publish new declared stable version; DRY_RUN: build only; PUBLISH_NEXT: explicit preview; PUBLISH_LATEST: stable retry"
        type: choice
        default: AUTO
        required: true
        options: [AUTO, DRY_RUN, PUBLISH_NEXT, PUBLISH_LATEST]
      version:
        description: "Optional VERSION override for dry run; required explicit prerelease for PUBLISH_NEXT; stable must match VERSION"
        required: false
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: observer-npm-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.select.outputs.version }}
      mode: ${{ steps.select.outputs.mode }}
      publish: ${{ steps.registry.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --test .github/scripts/npm-release-state.test.mjs
      - name: Select version and channel
        id: select
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          declared="$(cat VERSION)"
          stable='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          preview='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-(alpha|beta|rc|dev)\.(0|[1-9][0-9]*)$'
          [[ "$declared" =~ $stable ]]
          case "$GITHUB_EVENT_NAME" in
            pull_request) mode=DRY_RUN ;;
            push) mode=PUBLISH_LATEST ;;
            workflow_dispatch) mode="${REQUESTED_MODE:-AUTO}" ;;
            *) exit 1 ;;
          esac
          [[ "$mode" != AUTO ]] || mode=PUBLISH_LATEST
          version="${REQUESTED_VERSION:-$declared}"
          case "$mode" in
            DRY_RUN) [[ "$version" =~ $stable || "$version" =~ $preview ]] ;;
            PUBLISH_NEXT) [[ "$version" =~ $preview && -n "$REQUESTED_VERSION" ]] ;;
            PUBLISH_LATEST) [[ "$version" == "$declared" ]] ;;
            *) exit 1 ;;
          esac
          if [[ "$mode" != DRY_RUN ]]; then test "$GITHUB_REF" = refs/heads/main; fi
          printf 'version=%s\nmode=%s\n' "$version" "$mode" >> "$GITHUB_OUTPUT"
      - name: Check registry without publish permissions
        id: registry
        env:
          MODE: ${{ steps.select.outputs.mode }}
          VERSION: ${{ steps.select.outputs.version }}
        run: |
          set -euo pipefail
          case "$MODE" in
            DRY_RUN) echo publish=false >> "$GITHUB_OUTPUT" ;;
            PUBLISH_NEXT) node .github/scripts/npm-release-state.mjs @routilet/c-observer "$VERSION" next ;;
            PUBLISH_LATEST) node .github/scripts/npm-release-state.mjs @routilet/c-observer "$VERSION" latest ;;
          esac
  pack:
    needs: plan
    if: needs.plan.outputs.mode == 'DRY_RUN' || needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      MODE: ${{ needs.plan.outputs.mode }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Guard release mode and version
        run: |
          set -euo pipefail
          stable='^[0-9]+\.[0-9]+\.[0-9]+$'
          preview='^[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc|dev)\.[0-9]+$'
          case "$MODE" in
            DRY_RUN) [[ "$VERSION" =~ $stable || "$VERSION" =~ $preview ]] ;;
            PUBLISH_NEXT) [[ "$VERSION" =~ $preview ]] ;;
            PUBLISH_LATEST) [[ "$VERSION" =~ $stable ]] ;;
            *) exit 1 ;;
          esac
          if [[ "$MODE" != DRY_RUN ]]; then
            test "$GITHUB_REF" = refs/heads/main
            test -s LICENSE
          fi
      - run: go test ./...
      - run: go vet ./...
      - name: Package native binaries
        run: |
          set -euo pipefail
          args=()
          if [[ "$MODE" != DRY_RUN ]]; then args+=(--publishable); fi
          node scripts/package-preview.mjs "$VERSION" "$RUNNER_TEMP/observer-dist" "${args[@]}"
      - name: Verify actual installed tarball
        run: |
          set -euo pipefail
          file="$(find "$RUNNER_TEMP/observer-dist" -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$file"
          npm install --prefix "$RUNNER_TEMP/observer-install" --no-save --ignore-scripts --no-audit --no-fund "$file"
          root="$RUNNER_TEMP/observer-install/node_modules/@routilet/c-observer"
          binary="$root/bin/linux-x64/c-observer"
          test -x "$binary"
          test "$("$binary" --version)" = "$VERSION"
          "$binary" --capabilities
          ROOT="$root" node --input-type=module - <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          import {createHash} from "node:crypto";
          const root=process.env.ROOT;
          const pkg=JSON.parse(fs.readFileSync(path.join(root,"package.json")));
          const m=JSON.parse(fs.readFileSync(path.join(root,"manifest.json")));
          if(pkg.name!=="@routilet/c-observer" || pkg.version!==process.env.VERSION || m.version!==pkg.version || pkg.scripts) throw Error("unexpected package metadata");
          if(pkg.repository?.url!=="git+https://github.com/Routilet/c-observer.git") throw Error("GitHub provenance repository mismatch");
          if(process.env.MODE==="DRY_RUN" ? pkg.private!==true : pkg.private===true || pkg.publishConfig?.tag!==(process.env.VERSION.includes("-")?"next":"latest")) throw Error("incorrect publication metadata");
          if(pkg.license!=="MIT" || !fs.existsSync(path.join(root,"LICENSE")) || !fs.existsSync(path.join(root,"THIRD_PARTY_NOTICES.txt"))) throw Error("license files missing");
          for(const p of Object.values(m.platforms)) {
            const digest=createHash("sha256").update(fs.readFileSync(path.join(root,p.executable))).digest("hex");
            if(digest!==p.sha256) throw Error("binary digest mismatch");
          }
          NODE
          (cd "$RUNNER_TEMP/observer-dist"; sha256sum *.tgz *.tar.gz *.zip > SHA256SUMS)
      - name: Verify publishable metadata without publishing
        if: env.MODE == 'DRY_RUN'
        run: |
          set -euo pipefail
          node scripts/package-preview.mjs "$VERSION" "$RUNNER_TEMP/observer-public-check" --publishable
          file="$(find "$RUNNER_TEMP/observer-public-check" -maxdepth 1 -name '*.tgz' -print -quit)"
          npm install --prefix "$RUNNER_TEMP/observer-public-install" --no-save --ignore-scripts --no-audit --no-fund "$file"
          ROOT="$RUNNER_TEMP/observer-public-install/node_modules/@routilet/c-observer" node --input-type=module - <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          const root=process.env.ROOT;
          const p=JSON.parse(fs.readFileSync(path.join(root,"package.json")));
          if(p.private===true || p.license!=="MIT" || p.publishConfig?.access!=="public" || p.publishConfig?.tag!==(process.env.VERSION.includes("-")?"next":"latest") || p.scripts) throw Error("unexpected public metadata");
          if(p.repository?.url!=="git+https://github.com/Routilet/c-observer.git") throw Error("GitHub provenance repository mismatch");
          for(const name of ["LICENSE","THIRD_PARTY_NOTICES.txt","manifest.json"]) if(!fs.statSync(path.join(root,name)).size) throw Error("missing "+name);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: observer-npm-${{ env.VERSION }}
          path: |
            ${{ runner.temp }}/observer-dist/*.tgz
            ${{ runner.temp }}/observer-dist/*.tar.gz
            ${{ runner.temp }}/observer-dist/*.zip
            ${{ runner.temp }}/observer-dist/SHA256SUMS
          if-no-files-found: error
  native-install:
    needs: [plan, pack]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-15, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: observer-npm-${{ env.VERSION }}
          path: release
      - name: Verify native executable from installed package
        shell: bash
        run: |
          set -euo pipefail
          files=("$PWD"/release/*.tgz)
          test "${#files[@]}" = 1
          npm install --prefix "$RUNNER_TEMP/native-install" --no-save --ignore-scripts --no-audit --no-fund "${files[0]}"
          ROOT="$RUNNER_TEMP/native-install/node_modules/@routilet/c-observer" node --input-type=module - <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          import {execFileSync} from "node:child_process";
          import {createHash} from "node:crypto";
          const root=process.env.ROOT;
          const m=JSON.parse(fs.readFileSync(path.join(root,"manifest.json")));
          const entry=m.platforms[process.platform+"-"+process.arch];
          if(!entry) throw Error("missing native build");
          const bin=path.join(root,entry.executable);
          if(createHash("sha256").update(fs.readFileSync(bin)).digest("hex")!==entry.sha256) throw Error("digest mismatch");
          if(execFileSync(bin,["--version"],{encoding:"utf8"}).trim()!==process.env.VERSION) throw Error("version mismatch");
          const caps=JSON.parse(execFileSync(bin,["--capabilities"],{encoding:"utf8"}));
          if(!caps.sessionSchemaVersions.includes(1) || !caps.backends.length) throw Error("missing capabilities");
          if(process.platform==="win32" && !caps.backends.includes("gdb-mi")) throw Error("missing Windows GDB capability");
          console.log(process.platform,process.arch,caps);
          NODE
  publish:
    needs: [plan, pack, native-install]
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global 'npm@^11.21.0'
      - name: Recheck registry before publishing
        id: registry
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          tag=latest; if [[ "$MODE" == PUBLISH_NEXT ]]; then tag=next; fi
          node .github/scripts/npm-release-state.mjs @routilet/c-observer "$VERSION" "$tag"
      - uses: actions/download-artifact@v4
        with:
          name: observer-npm-${{ needs.plan.outputs.version }}
          path: release
      - name: Publish the verified tarball to the explicitly selected channel
        if: steps.registry.outputs.publish == 'true'
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          cd release
          sha256sum -c SHA256SUMS
          shopt -s nullglob
          files=(*.tgz)
          test "${#files[@]}" = 1
          case "$MODE" in
            PUBLISH_NEXT) tag=next ;;
            PUBLISH_LATEST) tag=latest ;;
            *) exit 1 ;;
          esac
          npm publish "./${files[0]}" --access public --tag "$tag"
