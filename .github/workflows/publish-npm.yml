          if [[ "$MODE" != DRY_RUN ]]; then
            npm view @routilet/c-observer versions --json --fetch-retries=0 --fetch-timeout=15000 > "$RUNNER_TEMP/observer-versions.json"
            node -e 'const v=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); if([v].flat().includes(process.env.VERSION)) throw Error("Version already published")' "$RUNNER_TEMP/observer-versions.json"
          fi
